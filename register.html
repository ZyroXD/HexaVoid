<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Void Registration</title>
  <style>
    /* Full-screen body with stars effect */
    body {
      margin: 0;
      padding: 0;
      background: #0d0d0d;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
    }

    #tsparticles {
      position: fixed;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .form-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 40px;
      width: 320px;
      box-shadow: 0 0 30px rgba(255, 0, 70, 0.3);
      color: #fff;
      animation: fadeIn 1s ease-in-out;
    }

    .form-box h2 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 28px;
      color: #ff004c;
    }

    .input-group {
      position: relative;
      margin-bottom: 25px;
    }

    .input-group input {
      width: 100%;
      padding: 12px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      color: #fff;
      font-size: 16px;
      outline: none;
    }

    .input-group label {
      position: absolute;
      left: 12px;
      top: 12px;
      color: rgba(255, 255, 255, 0.6);
      transition: 0.3s ease;
      pointer-events: none;
    }

    /* Particle Background */
    #particles-js {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: -1;
    }


    .input-group input:focus + label,
    .input-group input:not(:placeholder-shown) + label {
      top: -18px;
      left: 10px;
      font-size: 12px;
      background: transparent
      padding : 0 5px;
      color : #ff004c;
    }

    .form-box button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #ff004c;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .form-box button:hover {
      background: #ff3366;
      box-shadow: 0 0 15px #ff004c;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <!-- Particle Background -->
  <div id="particles-js"></div>

  <div class="container">
    <form class="form-box">
      <h2>Register</h2>

      <div class="input-group">
        <input type="text" placeholder=" " required />
        <label>Username</label>
      </div>

      <div class="input-group">
        <input type="email" placeholder=" " required />
        <label>Email</label>
      </div>

      <div class="input-group">
        <input type="password" placeholder=" " required />
        <label>Password</label>
      </div>
      <div class="input-group">
        <input type="password" placeholder=" " required />
        <label>Conform Password</label>
      </div>
      <button type="button" onclick="window.location.href='main.html'">Create Account</button>
    </form>
  </div>

  <!-- tsParticles -->
  <script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script>
    particlesJS("particles-js", {
      "particles": {
        "number": { "value": 80 },
        "color": { "value": "#ff0000" },
        "shape": { "type": "circle" },
        "opacity": { "value": 0.5 },
        "size": { "value": 3 },
        "line_linked": {
          "enable": true,
          "distance": 120,
          "color": "#ff0000",
          "opacity": 0.4,
          "width": 1
        },
        "move": {
          "enable": true,
          "speed": 2,
          "direction": "none",
          "random": false,
          "straight": false,
          "out_mode": "bounce"
        }
      },
      "interactivity": {
        "detect_on": "canvas",
        "events": {
          "onhover": { "enable": true, "mode": "repulse" },
          "onclick": { "enable": true, "mode": "push" }
        },
        "modes": {
          "repulse": { "distance": 100 },
          "push": { "particles_nb": 4 }
        }
      },
      "retina_detect": true
    });
  </script>

</body>
</html>
